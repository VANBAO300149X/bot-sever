services:
  - type: worker
    name: vbtool-telegram-bot
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -u vbbottele_render.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_IDS
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: KEY_SERVER_URL
        value: https://keyvip-sever1.onrender.com
      - key: KEY_SERVER_ADMIN_SECRET
        sync: false
